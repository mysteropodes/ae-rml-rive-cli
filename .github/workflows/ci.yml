name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-data:
    name: No private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_private.py

  lint:
    name: Lint (ruff, errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # syntax errors, invalid comparisons, misplaced statements, undefined names
      - run: ruff check --select E9,F63,F7,F82 --target-version py39 --output-format=github .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pip install -e ".[ae2rml]"
        run: pip install -e ".[ae2rml]"
      - name: rml2ae incremental rebuild (dry run, no After Effects)
        run: python -m rml2ae.tests.sim_incremental
      - name: ae2rml binds the second layer of map effects (Displacement Map)
        run: |
          python -m rml2ae.tests.test_map_layer
          # examples/fx_map.aep is made in After Effects by examples/make_fx_map_aep.jsx: checked once it is committed
          if [ -f examples/fx_map.aep ]; then
            ae2rml examples/fx_map.aep out/fx_map
            test "$(grep -c 'name="e1_mapSource"' out/fx_map/scene.rml)" -ge 3
          fi
      - name: ae2rml converts examples/demo.aep (console script)
        run: |
          ae2rml examples/demo.aep out/demo
          test -s out/demo/scene.rml
          grep -q "unsupported: 0" out/demo/build/ae2rml/report.md
      - name: Non-editable install works outside the repository (package data included)
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install -q ".[ae2rml]"
          cd /tmp && /tmp/wheel-env/bin/ae2rml "$GITHUB_WORKSPACE/examples/demo.aep" /tmp/demo-wheel
          diff "$GITHUB_WORKSPACE/out/demo/scene.rml" /tmp/demo-wheel/scene.rml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-rive-py${{ matrix.python }}
          path: out/demo

  rive-verify:
    name: Rive CLI --verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy fonttools py-aep
      # The Rive CLI is never stored in this repository: it comes from Rive's public manifest, sha256 checked
      # (the same source as rml2ae/install.sh and the Homebrew cask).
      - name: Install the Rive CLI (linux-x64) from releases.rive.app
        run: |
          set -euo pipefail
          man="$(curl -fsSL https://releases.rive.app/cli/latest/manifest.json)"
          path="$(printf '%s' "$man" | python -c "import json,sys; print(json.load(sys.stdin)['artifacts']['linux-x64']['path'])")"
          sum="$(printf '%s' "$man" | python -c "import json,sys; print(json.load(sys.stdin)['artifacts']['linux-x64']['sha256'])")"
          tmp="$(mktemp -d)"
          curl -fsSL "https://releases.rive.app/cli/$path" -o "$tmp/rive.tar.gz"
          echo "$sum  $tmp/rive.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/rive.tar.gz" -C "$tmp"
          mkdir -p "$HOME/.rive/bin"
          install -m 755 "$(find "$tmp" -type f -name rive | head -1)" "$HOME/.rive/bin/rive"
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      # the Linux build links EGL/GL even headless; Mesa provides them (and software Vulkan, lavapipe) on the runner
      - name: Rive CLI runtime libraries (Mesa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libgles2 libvulkan1 mesa-vulkan-drivers libegl-mesa0
          ldd "$HOME/.rive/bin/rive" | grep "not found" && exit 1 || true
      - run: rive --version
      # the command names the README diagram relies on (push, create --from-rev / --from-remote-file, --rev, --publish)
      - run: rive --help || true
      - name: Convert examples/demo.aep and verify it with the Rive CLI
        run: |
          python -m rml2ae.ae2rml examples/demo.aep out/demo --verify | tee out-verify.txt
          grep -q "rive --verify: ok" out-verify.txt

  fxlib:
    name: fxlib vs After Effects references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # software Vulkan (Mesa lavapipe): wgpu runs the WGSL effects on the CPU, no GPU needed
      - name: Mesa software Vulkan
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1
      # wgpu pinned: the baseline (fxref/baseline.json) was recorded with this version on lavapipe
      - run: pip install -e . "wgpu==0.32.0"
      - name: Every effect, every reference render (held-out included), vs the recorded baseline
        run: python -m rml2ae.ae2rml.fxlib regress --summary "$GITHUB_STEP_SUMMARY"
      # the plugin's GPU module (C++, the code the After Effects plugin renders with), built against the wgpu-native
      # library of the Python wgpu package, must render every fxlib setting exactly like wgsl_apply.py
      - name: Plugin GPU module (rs_apply) vs wgsl_apply
        run: |
          set -euo pipefail
          res="$(python -c "import wgpu, os; print(os.path.join(os.path.dirname(wgpu.__file__), 'resources'))")"
          wn="$RUNNER_TEMP/wgpu-native"
          mkdir -p "$wn/include/webgpu" "$wn/lib"
          cp "$res/webgpu.h" "$res/wgpu.h" "$wn/include/webgpu/"
          ln -sf "$res/libwgpu_native-release.so" "$wn/lib/libwgpu_native.so"
          cmake -S rml2ae/plugin -B "$RUNNER_TEMP/rsb" -DRS_GPU_ONLY=ON -DWGPU_NATIVE="$wn" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/rsb" --target rs_apply
          LD_LIBRARY_PATH="$wn/lib" python rml2ae/plugin/tools/oracle_check.py "$RUNNER_TEMP/rsb/rs_apply"

  windows:
    name: Windows (Python tools, plugin GPU module)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[ae2rml]" "wgpu==0.32.0"
      - name: ae2rml on the demo (.aep -> Rive CLI project)
        run: |
          ae2rml examples/demo.aep out/demo | Tee-Object -FilePath out-demo.txt
          if (-not (Select-String -Path out-demo.txt -Pattern "unsupported: 0" -Quiet)) { exit 1 }
      - run: python -m rml2ae.tests.test_map_layer
      - run: python -m rml2ae.tests.sim_incremental
      - name: rml2ae finds no After Effects here, and says so
        run: python -m rml2ae.ae doctor; exit 0
      # what Rive publishes: install.ps1 uses a Windows build of the CLI when the manifest has one
      - name: Rive CLI platforms in releases.rive.app
        run: (Invoke-RestMethod https://releases.rive.app/cli/latest/manifest.json).artifacts.PSObject.Properties.Name
      # the plugin's GPU module built with MSVC by build.ps1 (wgpu-native downloaded, sha256 checked), then the same
      # comparison as on Linux, on the software Direct3D 12 adapter (WARP): the runner has no GPU
      - name: build.ps1 -GpuOnly (MSVC, wgpu-native)
        run: rml2ae/plugin/build.ps1 -GpuOnly
      - name: Plugin GPU module (rs_apply.exe) vs wgsl_apply
        env:
          RS_WGPU_FALLBACK: "1"
        run: python rml2ae/plugin/tools/oracle_check.py "$env:LOCALAPPDATA\ae-plugin-deps\build-RiveShader-gpu\rs_apply.exe"
